name: Sanity dataset backup

# Added 2026-08-27 (PORTS.md card 6, pattern from presacademy).
#
# Nightly export of the production Sanity dataset (documents + assets) so a bad
# mutation, a bad seed script, or an accidental "Remove field" in Studio is
# always recoverable. Sanity is the single source of truth for every word on
# this site, so losing the dataset is losing the site's content.
#
# The schedule is ON. presacademy commented its schedule out because the daily
# gate job billed a minute a day to log "skipping" - that argument does not
# apply here: NateJ45/2ndpreschicago is a PUBLIC repository (confirmed by
# `gh repo view` on 2026-08-27) and GitHub Actions minutes are free on public
# repos. If this repo is ever made private, comment the schedule back out until
# the secret exists.
#
# ACTIVATION (waiting on a human as of 2026-08-27): the SANITY_AUTH_TOKEN secret
# is NOT set on this repo (`gh secret list` returned nothing). Until it is, the
# gate job logs a warning and the export is skipped, so the workflow is safe to
# commit now. A Sanity READ token is enough. Create one at manage.sanity.io ->
# project kz01wb83 -> API -> Tokens, then:
#     gh secret set SANITY_AUTH_TOKEN -R NateJ45/2ndpreschicago
#
# RESTORE: download the artifact from the workflow run, then
#     npx sanity dataset import sanity-backup-YYYY-MM-DD.tar.gz production
# (run it from the repo root, which is where the sanity CLI is installed since
# the studio folded into this package on 2026-09-06).

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_AUTH_TOKEN not set; skipping backup. See the header of this workflow for setup."
          fi

  export:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The sanity CLI is a root dependency now (the nested studio/ package was
      # folded in on 2026-09-06), so this runs from the repo root.
      - name: Install dependencies
        run: npm ci

      - name: Export production dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # This project's PUBLIC Sanity id (not a secret; it ships in the
          # client bundle and is already inlined in ci.yml).
          SANITY_STUDIO_PROJECT_ID: kz01wb83
          SANITY_STUDIO_DATASET: production
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          npx sanity dataset export production "sanity-backup-$STAMP.tar.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanity-backup
          path: sanity-backup-*.tar.gz
          # GitHub keeps artifacts 90 days. For longer or off-site retention,
          # push the tarball to R2 here instead.
          retention-days: 90
      # OFF-SITE COPY. The artifact above expires after 90 days and lives in the
      # same GitHub account as the repo it protects, so a lost account loses the
      # site AND its backups together. R2 is a different provider and a
      # different blast radius.
      #
      # No new credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
      # already set in every site repo for the deploy. The token does need R2
      # write permission added to it - a deploy-only token will 403 here.
      #
      # To enable, per site:
      #   1. Create the bucket:  npx wrangler r2 bucket create <name>
      #   2. Add "Workers R2 Storage: Edit" to CLOUDFLARE_API_TOKEN
      #   3. Set the BACKUP_R2_BUCKET repo variable to <name>
      # Unset, this step skips with a warning and the artifact still uploads,
      # matching the stance of the gate job: a missing off-site copy must never
      # fail the backup that is otherwise working.
      #
      # The tarball is ALREADY encrypted at this point. Do not move this step
      # above the encrypt step.
      - name: Copy the backup off-site to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::BACKUP_R2_BUCKET variable and/or Cloudflare credentials not set; the backup exists only as a 90-day GitHub artifact. See the header of sanity-backup.yml."
            exit 0
          fi
          for f in sanity-backup-*.tar.gz.enc; do
            # Keyed by repo so one bucket can hold the whole family, and by date
            # so a bad dataset restored last week has not overwritten the good
            # copy from the week before.
            KEY="sanity/${GITHUB_REPOSITORY##*/}/$f"
            echo "uploading $f -> $BUCKET/$KEY"
            # `|| echo ::warning::` because the header of this step promises
            # "a missing off-site copy must never fail the backup that is
            # otherwise working", and a bare command does not honour that. The
            # realistic failure is CLOUDFLARE_API_TOKEN lacking "Workers R2
            # Storage: Edit". The artifact is uploaded before this step, so the
            # backup still exists; only the off-site COPY is lost.
            npx wrangler r2 object put "$BUCKET/$KEY" --file "$f" --remote               || echo "::warning::off-site copy of $f failed - the 90-day GitHub artifact is still the backup. Check CLOUDFLARE_API_TOKEN carries 'Workers R2 Storage: Edit'."
          done
