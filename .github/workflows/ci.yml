name: CI

# This workflow validates the build and runs tests.
# It does NOT deploy — the live site auto-deploys via Cloudflare Workers
# on push to main (wired separately in the Cloudflare dashboard).

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Public identifiers — safe to inline; no secret or write token here.
      # Read token (SANITY_API_READ_TOKEN) is intentionally absent: sanityFetch
      # returns its fallback value when the token is missing, so the build
      # completes with empty-state pages rather than erroring out.
      PUBLIC_SANITY_PROJECT_ID: kz01wb83
      PUBLIC_SANITY_DATASET: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install studio dependencies
        run: npm ci --prefix studio

      - name: Generate Sanity types
        run: npm run typegen

      # Added 2026-08-27 (PORTS.md card 5). `npm run build` does not chain
      # typegen, so src/lib/sanity.types.ts is committed by hand after every
      # schema change - and sooner or later it is not. presacademy shipped types
      # describing a schema that no longer existed, on a green build. CI has just
      # regenerated the file from studio/schemaTypes; if that changed anything,
      # the committed copy was stale. Verified 2026-08-27: typegen reproduces the
      # committed file byte-for-byte here (the only local difference is line
      # endings, which git normalizes, so this is clean on Linux CI).
      - name: Fail if committed Sanity types are stale
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Build Astro
        run: npm run build

      - name: Build Sanity Studio
        run: npm --prefix studio run build

      - name: Run tests
        run: npm test
