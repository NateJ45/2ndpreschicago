name: CI

# This workflow validates the build and runs tests.
# It does NOT deploy: the live site auto-deploys via Cloudflare Workers Builds
# on push to main (wired separately in the Cloudflare dashboard), and staging
# deploys to the staging Worker through deploy-staging.yml.
#
# 2026-09-06: brought up to the family test standard (WCP is the reference):
# astro check, eslint, prettier format check, an internal link check over
# dist/client, and a separate `test` job running the Playwright suites (smoke,
# axe light + dark, reflow) on chromium and a WebKit iPhone profile.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public identifiers, safe to inline; no secret or write token here. The
# production dataset is public, so a token-less build reads the REAL published
# content: every event, sermon and custom page Sanity holds gets emitted, which
# is what makes the sweeps below meaningful rather than a placeholder audit.
# (sanityFetch would fall back to empty-state pages only if the project id
# itself were missing.)
env:
  PUBLIC_SANITY_PROJECT_ID: kz01wb83
  PUBLIC_SANITY_DATASET: production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # PORTS.md card 36. Every file here marked "PORTABLE: canonical copy" is
      # diffed against ncs-astro-sanity-starter, the library of record. Both
      # repos are public, so the checkout needs no token. CRLF is normalized to
      # LF and one trailing newline ignored before comparing, so a Windows
      # working tree and a Linux runner agree; everything else is byte-exact,
      # marker line included. On DRIFT: either port the improvement up into the
      # starter with a PORTS.md card in the same commit, or pull the starter's
      # copy forward here. A file that is forked on purpose drops its marker and
      # says so in its header instead.
      #
      # A staging build checks against the starter's staging, a main build (and
      # any PR) against its main. Without this the two-branch promotion model
      # cannot stage a canonical change at all: the starter's fix would have to
      # be promoted blind before any site could prove it. It also fixes the
      # promotion ORDER, which is now load-bearing - promote the starter first,
      # then the sites.
      - name: Check out the library of record
        uses: actions/checkout@v7
        with:
          repository: NateJ45/ncs-astro-sanity-starter
          ref: ${{ github.ref_name == 'staging' && 'staging' || 'main' }}
          path: .ncs-starter

      # The checkout is deleted again as soon as the check passes. It has to
      # live INSIDE the workspace (actions/checkout refuses a path outside it),
      # and every whole-tree tool further down this job would otherwise sweep
      # it: `prettier --check .` tries to format the library using THIS repo's
      # node_modules and dies resolving the starter's own imports, and `eslint .`
      # does the same. Deleting it here beats adding .ncs-starter to a
      # .prettierignore, a .gitignore and an eslint config in six repos, because
      # that list has to be remembered again for the next whole-tree tool.
      - name: Canonical files have not drifted
        id: sync_check
        continue-on-error: true
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: node scripts/sync-check.mjs

      # Drift is a judgement, not a diff: an improvement made here either
      # belongs in the library or is site-specific. What was missing is that
      # porting it up was an errand you had to remember to start, in another
      # repo, after the build that blocked you. This opens the PR instead. It
      # never merges, and it never turns a clear "drift" failure into a
      # confusing "could not authenticate" one: it exits 0 whatever happens.
      - name: Propose the drift to the library of record
        if: steps.sync_check.outcome == 'failure'
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: node scripts/propose-drift.mjs

      # The checkout has to go before any whole-tree tool further down this
      # job sweeps it, and the gate has to fail for real once it has.
      - name: Enforce the drift check
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: |
          rm -rf "$NCS_STARTER_DIR"
          [ "${{ steps.sync_check.outcome }}" = "success" ] || exit 1

      # NODE_OPTIONS raises the heap for this step only. `sanity schema extract`
      # bundles the whole Studio config and its import graph, and on the hosted
      # runners it intermittently dies with "Aborted (core dumped)" (exit 134)
      # while the same command succeeds locally: the classic signature of a
      # Linux CI box with less memory than the dev machine. It is runner flake,
      # not a schema problem, so retry up to three times before calling it red.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      # Added 2026-08-27 (PORTS.md card 5). `npm run build` does not chain
      # typegen, so src/lib/sanity.types.ts is committed by hand after every
      # schema change - and sooner or later it is not. presacademy shipped types
      # describing a schema that no longer existed, on a green build. CI has just
      # regenerated the file from src/sanity/schemaTypes; if that changed anything,
      # the committed copy was stale. Verified 2026-08-27: typegen reproduces the
      # committed file byte-for-byte here (the only local difference is line
      # endings, which git normalizes, so this is clean on Linux CI).
      - name: Fail if committed Sanity types are stale
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      # tsconfig.json excludes modules/ only. Since the studio folded into this
      # package (2026-09-06) this covers the Studio config, schemas and custom
      # components too - they are src/sanity/** now.
      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Node's built-in runner over src/lib/*.test.ts: section visibility,
      # slugify, utils, and the theme-token contrast pairs (the gate that reads
      # the real hex tokens out of globals.css; nothing else in this pipeline
      # can catch a palette edit that pushes body text or a focus ring under
      # threshold).
      - name: Unit tests (node --test)
        run: npm run test:unit

      # Builds the site AND the embedded Studio in one pass: @sanity/astro mounts
      # the Studio at /studio, so `astro build` bundles it. There is deliberately
      # no separate Studio build step any more (and no `sanity build`, which
      # writes to ./dist and would clobber this one).
      - name: Build Astro (site + embedded Studio)
        run: npm run build

      # linkinator over dist/client. The public site is still fully prerendered,
      # so every public route is in there; /studio, /preview/** and /api/* are
      # SSR-only and are skipped by the second pattern rather than reported as
      # broken. The log must say "scanned N links" with N well above zero; a run
      # that scans 0 links means the skip pattern swallowed linkinator's own
      # seed.
      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both projects in playwright.config.ts: chromium (desktop) AND
      # webkit-iphone (iPhone 14). Installing only chromium makes every webkit
      # test die with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # smoke (every route 200s and carries the church name in its title), axe
      # in light, axe in dark as a separate sweep plus a focus-indicator check
      # on the form routes (a theme swap is a different resting DOM), and
      # reflow at 320/768/1024/1440 (WCAG 1.4.10 starts at 320, not 375). The
      # config's webServer runs `npm run build` itself and serves dist/client
      # on 4321. The html reporter is added on the command line so local runs
      # keep the quiet `list` output while CI still produces the artifact.
      - name: Run tests (smoke, a11y light + dark, reflow)
        run: npm test -- --reporter=github,html

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
