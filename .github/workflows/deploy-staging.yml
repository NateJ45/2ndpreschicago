name: Deploy staging preview

# Deploys the `staging` branch to a SEPARATE Cloudflare Worker
# (2ndpreschicago-staging) so a change can be checked on the real edge before
# it reaches the live site. Production deploys via Cloudflare Workers Builds
# on push to main, wired separately in the Cloudflare dashboard — this
# workflow is the only way to rehearse a change first.
#
# Activates once these repo secrets exist: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. Until then the gate below skips the deploy with a
# warning rather than failing the run, so the workflow is safe to commit
# dormant (same pattern as sanity-backup.yml).
#
# HYBRID static+SSR since 2026-09-06 (the embedded Studio at /studio and the
# preview stack at /preview/** + /api/draft-mode/*). `astro build` now emits
# dist/client (the prerendered site) AND dist/server/wrangler.json (the root
# wrangler.jsonc merged with the adapter's SSR routing). The deploy MUST pass
# `-c dist/server/wrangler.json`: deploying the root config directly ships a
# Worker with no SSR routes, so /studio and /preview 404 while the static pages
# look fine. This comment used to say the flag was not needed here; that stopped
# being true the day the Studio was embedded.

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping staging deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      # Public identifiers, same as ci.yml — safe to inline, no secret here.
      PUBLIC_SANITY_PROJECT_ID: kz01wb83
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Sanity types
        run: npm run typegen

      - name: Build
        run: npm run build

      - name: Deploy to the staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c dist/server/wrangler.json --name 2ndpreschicago-staging
