name: Deploy staging preview

# Deploys the `staging` branch to a SEPARATE Cloudflare Worker
# (2ndpreschicago-staging) so a change can be checked on the real edge before
# it reaches the live site. Production deploys via Cloudflare Workers Builds
# on push to main, wired separately in the Cloudflare dashboard — this
# workflow is the only way to rehearse a change first.
#
# Activates once these repo secrets exist: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. Until then the gate below skips the deploy with a
# warning rather than failing the run, so the workflow is safe to commit
# dormant (same pattern as sanity-backup.yml).
#
# Static output (astro.config.mjs: output: 'static'), so a plain
# `wrangler deploy --name ...` reads the root wrangler.jsonc directly — no
# `-c dist/server/wrangler.json` config flag needed (that's only for the
# hybrid static+SSR sites in the family).

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping staging deploy."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      # Public identifiers, same as ci.yml — safe to inline, no secret here.
      PUBLIC_SANITY_PROJECT_ID: kz01wb83
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install studio dependencies
        run: npm ci --prefix studio

      - name: Generate Sanity types
        run: npm run typegen

      - name: Build
        run: npm run build

      - name: Deploy to the staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name 2ndpreschicago-staging
