# =============================================================================
# Dependabot — grouped weekly dependency PRs, validated by the existing gates
# =============================================================================
# One PR per week per ecosystem, minor+patch grouped so a Monday merge is one
# green-CI review, not twelve. Majors arrive as their own PRs (they deserve
# individual attention on this stack — Astro/Sanity/wrangler majors have
# real migration notes). CI + the Playwright suite are the safety net that
# makes auto-updates sane on a solo project.
# (Dependabot over Renovate: no app install needed — config-only, so it
# ships from a session without account-owner clicks. Same idea, less setup.)
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    ignore:
      # The Sanity stack is version-locked as a SET, not per package, and it
      # moves in one deliberate migration, never by Dependabot. Same rule WCP
      # and presacademy already use.
      #
      # The reason differs slightly HERE, so do not copy the sibling repos'
      # wording back over this. In those repos the Studio is bundled into the
      # Astro app, so a lone @sanity/ui bump nests a second copy next to the
      # one the sanity core wants: two styled-components contexts, and the
      # signed-in Studio dies while the login screen still works. This repo
      # keeps the Studio in its own package under studio/ with its own
      # lockfile, so site and Studio code are never in one bundle and the two
      # trees cannot collide that way (CLAUDE.md gotcha #9).
      #
      # The root package's only Sanity dependency is @sanity/client, pinned
      # EXACTLY at 7.26.2 (2026-09-06). The pin is what stops a caret walking
      # into @sanity/client 8, which is a real major with its own migration.
      - dependency-name: 'sanity'
      - dependency-name: '@sanity/*'
      - dependency-name: 'sanity-plugin-*'

  # studio/ is a SEPARATE npm project (own package.json + lockfile) this
  # config never watched, so it silently drifted -- same gap found and fixed
  # on reid-design-site and mas-monograms 2026-09-05.
  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 5
    ignore:
      # These three ignores arrived on 2026-09-06, AFTER Dependabot had already
      # carried this Studio from sanity 6.4 to 6.12 and across the @sanity/ui 4
      # boundary (#19 on 2026-09-04, #20 on 2026-09-05). That is why the Studio
      # here sits at what the studio-wide migration plan calls phase 2 while the
      # sibling repos are still on phase 1. It builds and typegens clean, but no
      # one has signed in to the deployed Studio since. See CLAUDE.md gotcha #10
      # before bumping anything in this block.
      - dependency-name: 'sanity'
      - dependency-name: '@sanity/*'
      - dependency-name: 'sanity-plugin-*'
      # TypeScript 7 (the native Go compiler) drops the JavaScript compiler API
      # that Astro's tooling drives astro check and the build through, so it
      # breaks the site. 6.0.3 is the studio standard (2026-09-06); the studio
      # rule is "never 7". Without this, Dependabot reopens the bump every week.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/New_York
    groups:
      actions:
        update-types: ['major', 'minor', 'patch']
